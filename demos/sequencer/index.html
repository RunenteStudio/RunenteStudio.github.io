<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runente Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="glass-container">
        <header>
            <h1>RUNENTE<span>BEATS</span></h1>
            <div class="controls">
                <div class="tempo-control">
                    <label for="bpm">TEMPO: <span id="bpm-value">120</span> BPM</label>
                    <input type="range" id="bpm" min="60" max="200" value="120">
                </div>
                <button id="randomize-btn" class="neon-button">RANDOMIZE</button>
            </div>
        </header>

        <main id="sequencer">
            <!-- Sequencer rows will be generated by JavaScript -->
        </main>

        <div class="instruction">
            <p>Presiona cualquier botón para comenzar a crear música</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
