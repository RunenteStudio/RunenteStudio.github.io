<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Avejentador</title>
  <!--  
  <link rel="stylesheet" href="./style.css">
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #demos {
      width: 100vw;
      height: 100vh;
    }

    .webcam {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      z-index: 1;
    }

    #webcamButton {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 2;
    }

    #videoSource {
      position: absolute;
      top: 50px;
      left: 20px;
      z-index: 2;
    }
  </style>
</head>

<script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>

<section id="demos" class="invisible">

  <div class="webcam">
    <button id="webcamButton">
      <span class="mdc-button__ripple"></span>
      <span class="mdc-button__label">ENABLE WEBCAM</span>
    </button>
    <!-- Add this dropdown where you want the camera selector to appear -->
    <label for="videoSource">Select Camera:</label>
    <select id="videoSource"></select>
    <video id="webcam"  autoplay style="display: none;"></video>
    <canvas id="canvas"></canvas>
  </div>
</section>
