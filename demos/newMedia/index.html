<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensure proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Landmarks with Three.js & MediaPipe</title>
  <style>
    /* Make sure the canvas fills the viewport */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
  <!-- Import map for our modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.1.0-alpha-16"
    }
  }
  </script>
</head>
<body>
  <!-- Our main.js file is loaded as an ES module -->
  <script type="module" src="script.js"></script>
</body>
</html>
