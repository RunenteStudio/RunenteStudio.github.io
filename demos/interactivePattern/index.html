<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tile Pattern – New Mode & Updated Probabilities</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

console.log("Initializing scene...");

////////////////////////////////////////////////////////////////////////////////
// CONFIGURATION
////////////////////////////////////////////////////////////////////////////////

// Minimum number of tiles along the shorter axis.
const tileCountShortAxis = 12; 

// Transition duration (the color animation length) in seconds.
const transitionDuration = 0.5; 

// Pattern line width as a fraction of the shape's bounding box.
const patternLineWidth = 0.3;   

//
// Color mode probabilities (when randomly assigning a tile's mode):
//   Mode 3: Only black – 10%
//   Mode 0: Black & grey gradient – 10%
//   Mode 1: Black & pastel gradient – 30%
//   Mode 2: Pastel-only – 50%
//
const modeProbNew = 0.2; // Mode 3: Only black.
const modeProb0 = 0.1;   // Mode 0: Black & grey gradient.
const modeProb1 = 0.4;   // Mode 1: Black & pastel.
const modeProb2 = 0.3;   // Mode 2: Pastel-only.

const MAX_GRID_SIZE = 64; // Maximum grid size for safety.

// Pastel color palette (8 colors, with pastel5 updated to hex f5ed81).
const pastelPalette = [
  new THREE.Color(0xa1/255, 0x79/255, 0xec/255), // a179ec
  new THREE.Color(0xfe/255, 0x74/255, 0x5d/255), // fe745d
  new THREE.Color(0xfb/255, 0xf2/255, 0x62/255), // fbf262
  new THREE.Color(0x95/255, 0xf3/255, 0x8a/255), // 95f38a
  new THREE.Color(0x8e/255, 0xcd/255, 0xe8/255), // 8ecde8
  new THREE.Color(0xf5/255, 0xed/255, 0x81/255), // f5ed81
  new THREE.Color(0xf5/255, 0x80/255, 0x95/255), // f58095
  new THREE.Color(0xf7/255, 0x9e/255, 0xf0/255)  // f79ef0
];

////////////////////////////////////////////////////////////////////////////////
// HELPER FUNCTIONS
////////////////////////////////////////////////////////////////////////////////

function randomRange(min, max) {
  return Math.random() * (max - min) + min;
}

function randomInt(maxInt) {
  return Math.floor(Math.random() * maxInt);
}

// Returns a color mode based on the defined probabilities.
// Modes:
//   3 = All black,
//   0 = Black & grey gradient,
//   1 = Black & pastel gradient,
//   2 = Pastel-only.
function getRandomMode() {
  const r = Math.random();
  if (r < modeProbNew) return 3;
  else if (r < modeProbNew + modeProb0) return 0;
  else if (r < modeProbNew + modeProb0 + modeProb1) return 1;
  else return 2;
}

////////////////////////////////////////////////////////////////////////////////
// MAIN SCENE SETUP
////////////////////////////////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
console.log("Renderer created and appended to DOM.");

const scene = new THREE.Scene();
// Create an orthographic camera that covers the full screen.
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

let clock = new THREE.Clock();

// Compute the tile counts based on the aspect ratio; the shorter axis always gets at least tileCountShortAxis tiles.
let aspect = window.innerWidth / window.innerHeight;
let tileCountX, tileCountY;
if (aspect >= 1.0) {
  tileCountY = tileCountShortAxis;
  tileCountX = Math.round(tileCountShortAxis * aspect);
} else {
  tileCountX = tileCountShortAxis;
  tileCountY = Math.round(tileCountShortAxis / aspect);
}
tileCountX = Math.min(tileCountX, MAX_GRID_SIZE);
tileCountY = Math.min(tileCountY, MAX_GRID_SIZE);
console.log("Tile counts computed:", { tileCountX, tileCountY });

// Create a full-screen plane geometry.
const planeGeometry = new THREE.PlaneGeometry(2, 2);

// Create two DataTextures to store each tile's state.
// Each tile stores: (shapeIndex, colorMode, randomSeed, transitionStartTime)
const size = tileCountX * tileCountY * 4;
const oldStateData = new Float32Array(size);
const newStateData = new Float32Array(size);

function setTileData(array, tileIndex, r, g, b, a) {
  const i = tileIndex * 4;
  array[i + 0] = r;
  array[i + 1] = g;
  array[i + 2] = b;
  array[i + 3] = a;
}

function getTileData(array, tileIndex) {
  const i = tileIndex * 4;
  return [array[i + 0], array[i + 1], array[i + 2], array[i + 3]];
}

// Initialize tile states with random values.
// Border tiles (first/last row or column) are forced into mode 3 (all black).
console.log("Initializing tile states...");
for (let y = 0; y < tileCountY; y++) {
  for (let x = 0; x < tileCountX; x++) {
    const tileIndex = y * tileCountX + x;
    const shapeIndex = randomInt(10); // Random shape indices from 0 to 9.
    let colorMode = getRandomMode();
    if (x === 0 || x === tileCountX - 1 || y === 0 || y === tileCountY - 1) {
      colorMode = 3;
    }
    const randomSeed = Math.random();
    setTileData(oldStateData, tileIndex, shapeIndex, colorMode, randomSeed, 0.0);
    setTileData(newStateData, tileIndex, shapeIndex, colorMode, randomSeed, 0.0);
  }
}
console.log("Tile states initialized.");

// Create DataTextures from the state arrays.
const oldStateTex = new THREE.DataTexture(
  oldStateData,
  tileCountX,
  tileCountY,
  THREE.RGBAFormat,
  THREE.FloatType
);
oldStateTex.needsUpdate = true;
console.log("Old state DataTexture created.");

const newStateTex = new THREE.DataTexture(
  newStateData,
  tileCountX,
  tileCountY,
  THREE.RGBAFormat,
  THREE.FloatType
);
newStateTex.needsUpdate = true;
console.log("New state DataTexture created.");

// Set up uniforms to pass to the shader.
const uniforms = {
  iTime:              { value: 0.0 },
  resolution:         { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  tileCount:          { value: new THREE.Vector2(tileCountX, tileCountY) },
  transitionDuration: { value: transitionDuration },
  patternLineWidth:   { value: patternLineWidth },
  oldStateTex:        { value: oldStateTex },
  newStateTex:        { value: newStateTex }
};

////////////////////////////////////////////////////////////////////////////////
// SHADER MATERIAL
////////////////////////////////////////////////////////////////////////////////

const fragmentShader = `
precision highp float;

uniform float iTime;
uniform vec2  resolution;
uniform vec2  tileCount;
uniform float transitionDuration;
uniform float patternLineWidth;

uniform sampler2D oldStateTex;
uniform sampler2D newStateTex;

#define PI 3.1416

///////////////////////////////////////////////////////////////////////////
// Pastel Palette and Gradient Functions
///////////////////////////////////////////////////////////////////////////
// Fixed pastel palette with 8 colors.
vec3 pastel0 = vec3(0.631, 0.475, 0.925); // a179ec
vec3 pastel1 = vec3(0.996, 0.455, 0.365); // fe745d
vec3 pastel2 = vec3(0.984, 0.949, 0.384); // fbf262
vec3 pastel3 = vec3(0.584, 0.953, 0.541); // 95f38a
vec3 pastel4 = vec3(0.557, 0.804, 0.910); // 8ecde8
vec3 pastel5 = vec3(0.960, 0.929, 0.505); // f5ed81
vec3 pastel6 = vec3(0.961, 0.502, 0.584); // f58095
vec3 pastel7 = vec3(0.969, 0.620, 0.941); // f79ef0

// Select three pastel colors based on the seed.
void pickPastels(float seed, out vec3 colA, out vec3 colB, out vec3 colC) {
  int idxA = int(floor(fract(seed * 12.34) * 8.0));
  int idxB = int(floor(fract(seed * 56.78) * 8.0));
  int idxC = int(floor(fract(seed * 90.12) * 8.0));
  
  vec3 palette[8];
  palette[0] = pastel0; palette[1] = pastel1; palette[2] = pastel2; palette[3] = pastel3;
  palette[4] = pastel4; palette[5] = pastel5; palette[6] = pastel6; palette[7] = pastel7;
  
  colA = palette[idxA];
  colB = palette[idxB];
  colC = palette[idxC];
}

// Returns a two-color gradient by interpolating between two colors.
vec3 twoColorGradient(float factor, vec3 colA, vec3 colB) {
  return mix(colA, colB, factor);
}

///////////////////////////////////////////////////////////////////////////
// Discrete Position and Size Functions
///////////////////////////////////////////////////////////////////////////
// Returns a discrete size factor: 1.0 means the shape's bounding box fills one tile,
// 2.0 means the bounding box is twice as large as one tile.
float getDiscreteSize(float seed) {
  return (fract(seed * 7.0) < 0.5) ? 1.0 : 0.5;
}

// Returns one of 9 discrete positions (center, corners, edges) for the shape's center.
// The positions use 0.0 and 1.0 so that shapes can be forced to the borders.
vec2 getDiscretePosition(float seed) {
  int posIndex = int(floor(fract(seed * 11.11) * 9.0));
  vec2 positions[9];
  positions[0] = vec2(0.5, 0.5);    // Center
  positions[1] = vec2(0.0, 0.0);      // Bottom-left
  positions[2] = vec2(1.0, 0.0);      // Bottom-right
  positions[3] = vec2(0.0, 1.0);      // Top-left
  positions[4] = vec2(1.0, 1.0);      // Top-right
  positions[5] = vec2(0.5, 0.0);      // Bottom-center
  positions[6] = vec2(0.5, 1.0);      // Top-center
  positions[7] = vec2(0.0, 0.5);      // Left-center
  positions[8] = vec2(1.0, 0.5);      // Right-center
  return positions[posIndex];
}

///////////////////////////////////////////////////////////////////////////
// SHAPE Coverage Function
///////////////////////////////////////////////////////////////////////////
// Computes the coverage (0.0 to 1.0) for the selected shape,
// drawn within a bounding box whose size equals the discrete size factor.
// (A size factor of 1.0 means one tile; 2.0 means twice as large.)
float shapeCoverage(int shapeIndex, vec2 localUV, float seed) {
  float sizeFactor = getDiscreteSize(seed);
  float boxSize = sizeFactor;      // Bounding box size in normalized tile coordinates.
  float radius = 1.0 * boxSize;      // Radius used for circle and ring shapes.
  vec2 shapeCenter = getDiscretePosition(seed);
  
  // Compute the origin and relative coordinates within the bounding box.
  vec2 boxOrigin = shapeCenter - 0.5 * boxSize;
  vec2 relCoord = (localUV - boxOrigin) / boxSize;
  float d = distance(localUV, shapeCenter);
  float coverage = 0.0;
  
  if (shapeIndex == 0) {
    // Full circle covering the entire bounding box.
    coverage = step(d, radius);
  }
  else if (shapeIndex == 1) {
    // Half circle: only the top half of the bounding box is filled.
    coverage = step(d, radius) * step(0.5, relCoord.y);
  }
  else if (shapeIndex == 2) {
    // Diamond (rotated square): pixels where |x-0.5|+|y-0.5| ≤ 0.5.
    float diamond = abs(relCoord.x - 0.5) + abs(relCoord.y - 0.5);
    coverage = step(diamond, 0.5);
  }
  else if (shapeIndex == 3) {
    // Ring: a circular band with the inner area left as background.
    float outer = radius;
    float inner = outer - patternLineWidth;
    float ring = abs(step(outer, d) - step(inner, d));
    if (d < inner) { ring = 0.0; }
    coverage = ring;
  }
  else if (shapeIndex == 4) {
    // Square: fills the central half of the bounding box.
    vec2 diff = abs(localUV - shapeCenter);
    coverage = step(diff.x, 0.5 * boxSize) * step(diff.y, 0.5 * boxSize);
  }
  else if (shapeIndex == 5) {
    // Checker pattern within the bounding box.
    vec2 coord = (localUV - boxOrigin) / boxSize;
    vec2 cpos = floor(coord * 1.0);
    coverage = mod(cpos.x + cpos.y, 2.0);
  }
  else if (shapeIndex == 6) {
    // Arc: a ring segment on the left half of the bounding box.
    float outer = radius;
    float inner = outer - patternLineWidth;
    float ring = abs(step(outer, d) - step(inner, d));
    coverage = ring * step(relCoord.x, 0.5);
  }
  else if (shapeIndex == 7) {
    // Diagonal line across the bounding box.
    float line = abs(relCoord.x - relCoord.y);
    coverage = step(line, patternLineWidth);
  }
  else if (shapeIndex == 8) {
    // Vertical line centered in the bounding box.
    float diff = abs(relCoord.x - 0.5);
    coverage = step(diff, patternLineWidth * 1.0);
  }
  else if (shapeIndex == 9) {
    // Horizontal line centered in the bounding box.
    float diff = abs(relCoord.y - 0.5);
    coverage = step(diff, patternLineWidth * 1.0);
  }
  else if (shapeIndex == 10) {
    // New Shape: Checker pattern rotated by 45°.
    float angle = PI / 4.0;
    mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
    vec2 rotatedCoord = rot * (relCoord - vec2(0.5)) + vec2(0.5);
    vec2 cpos = floor(rotatedCoord * 2.0);
    coverage = mod(cpos.x + cpos.y, 2.0);
  }
  else if (shapeIndex == 11) {
    // New Shape: Half circle rotated by 45°.
    float angle = PI / 4.0;
    mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
    vec2 rotatedRel = rot * (relCoord - vec2(0.5)) + vec2(0.5);
    coverage = step(distance(rotatedRel, vec2(0.5)), 0.5) * step(0.5, rotatedRel.y);
  }
  else {
    coverage = 1.0;
  }
  return coverage;
}

///////////////////////////////////////////////////////////////////////////
// TILE COLOR FUNCTION
///////////////////////////////////////////////////////////////////////////
// Computes the final color for a tile based on its shape coverage and color mode.
// Color modes:
//   0: Black & grey gradient (light grey shape on dark grey background),
//   1: Black & pastel (two-color pastel gradient over dark grey),
//   2: Pastel-only (pastel background with a two-color pastel gradient for the shape),
//   3: Only black (entire tile in dark grey).
// This version does not crossfade between states; instead, the new state is applied immediately.
// A color animation is applied by offsetting the gradient factor using an animated value with ease-out.
vec3 tileColor(float coverage, int colorMode, float seed, vec2 localUV, float animOffset) {
  vec3 shapeColor;
  vec3 bgColor;
  vec3 colA, colB, colC;
  pickPastels(seed, colA, colB, colC);
  
  // Determine the base gradient factor.
  // For radial gradients, the origin is chosen from one of the four corners.
  float gradientType = fract(sin(seed * 100.0) * 10000.0);
  float gradFactor;
  if (gradientType < 0.5) {
    int cornerIndex = int(floor(fract(seed * 2.718) * 4.0));
    vec2 corner;
    if(cornerIndex == 0) corner = vec2(0.0, 0.0);
    else if(cornerIndex == 1) corner = vec2(1.0, 0.0);
    else if(cornerIndex == 2) corner = vec2(0.0, 1.0);
    else corner = vec2(1.0, 1.0);
    gradFactor = smoothstep(0.0, 1.0, distance(localUV, corner));
  } else {
    gradFactor = localUV.x;
  }
  // Apply the animated offset with ease-out to shift the gradient.
  gradFactor = fract(gradFactor + animOffset);
  
  if (colorMode == 0) {
    // Black & grey gradient: light grey shape on dark grey background.
    shapeColor = vec3(0.95);
    bgColor = vec3(0.1);
  } else if (colorMode == 1) {
    // Black & pastel: two-color pastel gradient over dark grey.
    shapeColor = twoColorGradient(gradFactor, colA, colB);
    bgColor = vec3(0.1);
  } else if (colorMode == 2) {
    // Pastel-only: pastel background with two-color pastel gradient for the shape.
    bgColor = colC;
    shapeColor = twoColorGradient(gradFactor, colA, colB);
  } else if (colorMode == 3) {
    // Only black: entire tile rendered in dark grey.
    shapeColor = vec3(0.1);
    bgColor = vec3(0.1);
  }
  
  return mix(bgColor, shapeColor, coverage);
}

///////////////////////////////////////////////////////////////////////////
// MAIN FRAGMENT SHADER
///////////////////////////////////////////////////////////////////////////
// This shader immediately applies the new tile state (new pattern)
// and then animates the gradient color offset over the duration of transitionDuration.
// The animation uses a quadratic ease-out function.
void main() {
  // Normalize fragment coordinates.
  vec2 uv = gl_FragCoord.xy / resolution;
  
  // Determine tile indices and the local coordinate within the tile.
  vec2 tileIndex2D = floor(uv * tileCount);
  vec2 localUV = fract(uv * tileCount);
  
  // Compute texture coordinate for sampling the tile state.
  vec2 texSize = vec2(textureSize(oldStateTex, 0));
  vec2 tileUV = (tileIndex2D + 0.5) / texSize;
  
  // Retrieve the new state for this tile.
  vec4 newData = texture2D(newStateTex, tileUV);
  
  int newShape = int(floor(newData.r + 0.5));
  int newMode  = int(floor(newData.g + 0.5));
  float newSeed = newData.b;
  float startT  = newData.a;
  
  // Compute elapsed time since the tile's state changed.
  float dt = iTime - startT;
  float animT = clamp(dt / transitionDuration, 0.0, 1.0);
  // Apply quadratic ease-out to the animated offset.
  float ease = pow(1.0 - animT, 4.0);
  
  // Use the new state immediately for the shape and pattern,
  // then apply the animated gradient offset.
  vec3 colorNew = tileColor(shapeCoverage(newShape, localUV, newSeed), newMode, newSeed, localUV, ease);
  gl_FragColor = vec4(colorNew, 1.0);
}
`;

const vertexShader = `
void main() {
  gl_Position = vec4(position, 1.0);
}
`;

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms
});
console.log("Shader material created.");

const mesh = new THREE.Mesh(planeGeometry, material);
scene.add(mesh);
console.log("Mesh added to scene.");

////////////////////////////////////////////////////////////////////////////////
// INTERACTION: CLICK/TAP TO CHANGE TILE
///////////////////////////////////////////////////////////////////////////////////
// On user click/tap, compute the tile coordinates, then assign a new random state
// (with a random shape index [0–9], a color mode from getRandomMode(), and a random seed),
// and record the current time as the transition start.
renderer.domElement.addEventListener('pointerdown', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const nx = x / rect.width;
  const ny = 1.0 - (y / rect.height);
  const tx = Math.floor(nx * tileCountX);
  const ty = Math.floor(ny * tileCountY);
  
  console.log("Pointer down at:", { clientX: event.clientX, clientY: event.clientY, normalized: { nx, ny } });
  console.log("Computed tile coordinates:", { tx, ty });
  
  if (tx < 0 || tx >= tileCountX || ty < 0 || ty >= tileCountY) {
    console.log("Click out of bounds, ignoring.");
    return;
  }
  
  const tileIndex = ty * tileCountX + tx;
  const shapeIndex = randomInt(10); // Random shape index from 0–9.
  const colorMode = getRandomMode();
  const randomSeed = Math.random();
  const startTime = clock.getElapsedTime();
  
  setTileData(newStateData, tileIndex, shapeIndex, colorMode, randomSeed, startTime);
  newStateTex.needsUpdate = true;
  console.log("Updated tile", tileIndex, "with new state:", { shapeIndex, colorMode, randomSeed, startTime });
});

////////////////////////////////////////////////////////////////////////////////
// FUNCTION: CHANGE ALL TILES
////////////////////////////////////////////////////////////////////////////////
// This function updates every tile at once with a new random state.
// It is triggered when the user presses the "R" key.
window.addEventListener('keydown', (event) => {
  if (event.key === 'r' || event.key === 'R') {
    console.log("R key pressed. Updating all tiles...");
    const currentTime = clock.getElapsedTime();
    const totalTiles = tileCountX * tileCountY;
    for (let tileIndex = 0; tileIndex < totalTiles; tileIndex++) {
      const newShape = randomInt(10);
      const newMode = getRandomMode();
      const newSeed = Math.random();
      // Update the new state for this tile.
      setTileData(newStateData, tileIndex, newShape, newMode, newSeed, currentTime);
    }
    newStateTex.needsUpdate = true;
    console.log("All tiles updated.");
  }
});

////////////////////////////////////////////////////////////////////////////////
// WINDOW RESIZE HANDLING
////////////////////////////////////////////////////////////////////////////////
// Adjust renderer size and update uniform resolution on window resize.
function onWindowResize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
  console.log("Window resized:", { width: window.innerWidth, height: window.innerHeight });
}
window.addEventListener('resize', onWindowResize);

////////////////////////////////////////////////////////////////////////////////
// RENDER LOOP
////////////////////////////////////////////////////////////////////////////////
// Continuously update the time uniform and render the scene.
function animate() {
  requestAnimationFrame(animate);
  uniforms.iTime.value = clock.getElapsedTime();
  if (Math.floor(uniforms.iTime.value) % 5 === 0) {
    console.log("Elapsed time:", uniforms.iTime.value.toFixed(2));
  }
  renderer.render(scene, camera);
}

console.log("Starting animation loop...");
onWindowResize();
animate();
</script>
</body>
</html>
