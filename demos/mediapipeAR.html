<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-face-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
        }
    }
</script>
<script type="module">
  import * as THREE from 'three';
  import { MindARThree } from 'mindar-face-three';
  const mindarThree = new MindARThree({
    container: document.querySelector("#container"),
});
  const {renderer, scene, camera} = mindarThree;
  const light = new THREE.HemisphereLight( 0xffffff, 0xf7f4d5, 0.5 );
  const directionalLight = new THREE.DirectionalLight( 0xffffff, 1 );
  directionalLight.position.set(-3,4,1);

  scene.add(light);
  scene.add(directionalLight);

  const faceMesh = mindarThree.addFaceMesh();
  const faceMesh2 = mindarThree.addFaceMesh();

  const textureShadow = new THREE.TextureLoader().load("/demos/faceAssets/shadowsThree.png");
  const textureSpots = new THREE.TextureLoader().load("/demos/faceAssets/spotsThree.png");

  faceMesh.material.map = textureShadow;
  faceMesh.material.opacity = 0.2;
  faceMesh.material.transparent = true;
  faceMesh.material.needsUpdate = true;

  faceMesh2.material.map = textureSpots;
  faceMesh2.material.opacity = 0.2;
  faceMesh2.material.transparent = true;
  faceMesh2.material.needsUpdate = true;

  scene.add(faceMesh);
  scene.add(faceMesh2);

  const start = async() => {
    await mindarThree.start();
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
  });
}
start();
</script>

<style>
  body {
    margin: 0;
}
#container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}
</style>

</head>

<body>
    <div id="container">
    </div>
</body>
</html>
