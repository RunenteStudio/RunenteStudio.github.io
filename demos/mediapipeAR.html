<!DOCTYPE html>
<html>
<head>
    <title>Hair Segmentation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mediapipe/0.3.1620248843/mediapipe.js"></script>
    <style>
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            margin: 20px auto;
        }
        #webcam, #output {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #output {
            mix-blend-mode: screen;
        }
        .controls {
            text-align: center;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="startBtn">Start Camera</button>
        <button id="stopBtn">Stop Camera</button>
    </div>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output"></canvas>
    </div>

    <script>
        let videoElement = document.getElementById('webcam');
        let canvasElement = document.getElementById('output');
        let canvasCtx = canvasElement.getContext('2d');
        let mediaStream = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // Initialize MediaPipe Hair Segmentation
        const hairSegmentation = new MediaPipe.SelfieSegmentation({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
            }
        });

        hairSegmentation.setOptions({
            modelSelection: 1,
            selfieMode: true,
        });

        hairSegmentation.onResults(onResults);

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: 640,
                        height: 480
                    }
                });
                videoElement.srcObject = mediaStream;
                videoElement.width = 640;
                videoElement.height = 480;
                canvasElement.width = 640;
                canvasElement.height = 480;
                requestAnimationFrame(predictWebcam);
            } catch (err) {
                console.error("Error accessing webcam:", err);
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null;
            }
        }

        async function predictWebcam() {
            if (videoElement.srcObject) {
                await hairSegmentation.send({image: videoElement});
                requestAnimationFrame(predictWebcam);
            }
        }

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw the segmentation mask
            canvasCtx.globalCompositeOperation = 'source-over';
            canvasCtx.fillStyle = 'rgba(255, 0, 255, 0.5)'; // Pink overlay for hair
            
            if (results.segmentationMask) {
                canvasCtx.drawImage(
                    results.segmentationMask,
                    0, 0, canvasElement.width, canvasElement.height
                );
            }
        }

        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            stopCamera();
        });
    </script>
</body>
</html>
