<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Race</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 0.5em;
    }
    .status, .player-slot {
      margin-bottom: 10px;
    }
    label {
      font-size: 16px;
      margin-right: 5px;
    }
    select {
      font-size: 16px;
      padding: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-right: 10px;
      margin-top: 10px;
    }
    /* Style for the big action button */
    #actionButton {
      width: 100%;
      height: 100vw;
      padding: 20px;
      font-size: 24px;
      margin-top: 20px;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    #actionButton.pressed {
      filter: brightness(70%);
    }
    /* Style for the simulation mode button */
    #simulationButton {
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Patitos</h1>
  <!-- Add audio element -->
  <audio id="duckSound" src="duck.wav" preload="auto"></audio>
  <div class="status">Status: <span id="connectionStatus">Disconnected</span></div>
  
  <!-- Player Slot Selection Dropdown -->
  <div class="player-slot">
    <label for="playerSlot">Jugador:</label>
    <select id="playerSlot">
      <option value="p1">Player 1</option>
      <option value="p2">Player 2</option>
      <option value="p3">Player 3</option>
      <option value="p4">Player 4</option>
      <option value="p5">Player 5</option>
      <option value="p6">Player 6</option>
      <option value="p7">Player 7</option>
      <option value="p8">Player 8</option>
    </select>
  </div>
  
  <!-- Button to disconnect the WebSocket connection -->
  <button id="disconnectButton">Disconnect</button>
  <!-- Big Action Button -->
  <button id="actionButton"></button>
  <!-- Simulation Mode Button -->
  <button id="simulationButton">Modo fantasma</button>

  <script>
    // WebSocket variables
    let ws;
    const wsUrl = "wss://td-tests-b8ab469bdcc6.herokuapp.com";
    let manualDisconnect = false;
    const connectionStatusElem = document.getElementById('connectionStatus');

    // Button pressed state (for the action button)
    let buttonPressed = false;

    // Simulation mode flag and timer id
    let simulationMode = false;
    let simulationTimeoutID = null;

    // Update interval id and rate (20 times per second)
    let updateIntervalID = null;
    const updateInterval = 25; // milliseconds

    // Get player slot dropdown element
    const playerSlotSelect = document.getElementById('playerSlot');

    // Define color palette for player slots
    const playerColors = {
      'p1': '#FF4136', // Red
      'p2': '#2ECC40', // Green
      'p3': '#0074D9', // Blue
      'p4': '#FFDC00', // Yellow
      'p5': '#B10DC9', // Purple
      'p6': '#FF851B', // Orange
      'p7': '#00C4B4', // Teal
      'p8': '#FF69B4'  // Hot Pink
    };

    // Function to update the connection status display
    function updateStatus(status) {
      connectionStatusElem.textContent = status;
    }

    // Function to connect (or reconnect) the WebSocket
    function connectWebSocket() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("WebSocket connected");
        updateStatus("Connected");
      };

      ws.onclose = () => {
        console.log("WebSocket disconnected");
        updateStatus("Disconnected");
        if (!manualDisconnect) {
          updateStatus("Reconnecting...");
          setTimeout(connectWebSocket, 3000);
        }
      };

      ws.onerror = (error) => {
        console.error("WebSocket error:", error);
        ws.close();
      };

      ws.onmessage = (msg) => {
        console.log("Received message:", msg.data);
      };
    }

    // Start initial WebSocket connection
    connectWebSocket();

    // Disconnect button functionality
    document.getElementById('disconnectButton').addEventListener('click', () => {
      manualDisconnect = true;
      if (ws) {
        ws.close();
      }
      updateStatus("Disconnected");
    });

    // Start regular updates (sending messages)
    function startUpdates() {
      updateIntervalID = setInterval(() => {
        // Use the currently selected player slot value
        const currentId = playerSlotSelect.value;
        const message = JSON.stringify({
          id: currentId,
          pr: buttonPressed ? 1 : 0
        });

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(message);
        }
      }, updateInterval);
    }

    // Stop updates
    function stopUpdates() {
      if (updateIntervalID !== null) {
        clearInterval(updateIntervalID);
        updateIntervalID = null;
      }
    }

    // Simulation loop: sends simulated events at random intervals
    function startSimulationLoop() {
      function simulateEvent() {
        const randomPressed = Math.random() < 0.1 ? 1 : 0;
        
        // Use the currently selected player slot value
        const currentId = playerSlotSelect.value;
        const message = JSON.stringify({
          id: currentId,
          pr: randomPressed
        });

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(message);
        }
        // Schedule next simulated event
        const delay = Math.random() * 10 + 20;
        simulationTimeoutID = setTimeout(simulateEvent, delay);
      }
      simulateEvent();
    }

    // Stop simulation loop
    function stopSimulationLoop() {
      if (simulationTimeoutID !== null) {
        clearTimeout(simulationTimeoutID);
        simulationTimeoutID = null;
      }
    }

    // Action Button event handling for both mouse and touch events
    const actionButton = document.getElementById('actionButton');
    const duckSound = document.getElementById('duckSound');

    function setButtonPressed(state) {
      buttonPressed = state;
      if (state) {
        actionButton.classList.add('pressed');
        // Play sound when button is pressed
        duckSound.currentTime = 0; // Reset sound to start
        duckSound.play().catch(error => console.log('Error playing sound:', error));
      } else {
        actionButton.classList.remove('pressed');
      }
    }
    actionButton.addEventListener('mousedown', () => setButtonPressed(true));
    actionButton.addEventListener('mouseup', () => setButtonPressed(false));
    actionButton.addEventListener('mouseleave', () => setButtonPressed(false));
    actionButton.addEventListener('touchstart', (e) => {
      e.preventDefault();
      setButtonPressed(true);
    });
    actionButton.addEventListener('touchend', () => setButtonPressed(false));
    actionButton.addEventListener('touchcancel', () => setButtonPressed(false));

    // Simulation Mode Button: toggles simulation mode
    const simulationButton = document.getElementById('simulationButton');
    simulationButton.addEventListener('click', () => {
      simulationMode = !simulationMode;
      if (simulationMode) {
        stopUpdates();
        startSimulationLoop();
        simulationButton.textContent = "Stop Simulation";
      } else {
        stopSimulationLoop();
        startUpdates();
        simulationButton.textContent = "Start Simulation";
      }
    });

    // Function to update button color based on player slot
    function updateButtonColor() {
      const selectedSlot = playerSlotSelect.value;
      actionButton.style.backgroundColor = playerColors[selectedSlot];
    }

    // Add event listener for player slot changes
    playerSlotSelect.addEventListener('change', updateButtonColor);

    // Set initial button color
    updateButtonColor();

    // Start updates by default
    startUpdates();
  </script>
</body>
</html>
