<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image sender</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
    canvas {
      width: 90vw;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      display: block;
      margin-bottom: 10px;
      touch-action: none;
      border: 1px solid #ccc;
    }
    button {
      font-size: 1.2rem;
      padding: 10px;
      margin-bottom: 5px;
    }
    #colorButtons button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      margin: 4px;
      cursor: pointer;
    }
    #sizeButtons {
      display: flex;
      flex-direction: row;
      justify-content: center;
    }
    #sizeButtons button {
      width: 50px;
      height: 50px;
      margin: 4px;
      padding: 0;
      background-color: #eee;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sizeButtons svg {
      display: block;
    }
    #mainContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #colorButtons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .selected {
      outline: 3px solid rgb(219, 219, 219);
      outline-offset: 2px;
    }
    #actionButtons {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
    }
    #actionButtons hr {
      width: 100%;
      max-width: 400px;
      margin-bottom: 10px;
    }
    #actionButtons button {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <h2 style="text-align: center;">Remote Draw</h2>
  <div id="mainContainer">
    <div style="position: relative;">
      <img id="guideImage" src="guideNo.png" style="position: absolute; width: 90vw; max-width: 400px; aspect-ratio: 1 / 1; pointer-events: none; z-index: 1;" />
      <canvas id="canvas" width="400" height="400"></canvas>
    </div>
    <div id="controls">
      <div id="colorButtons"></div>
      <div id="sizeButtons">
        <button onclick="fillCanvas()" title="Fill Canvas">
          🪣
        </button>
        <button onclick="setSize(2)">
          <svg width="16" height="16"><circle cx="8" cy="8" r="2" fill="black"/></svg>
        </button>
        <button onclick="setSize(6)">
          <svg width="24" height="24"><circle cx="12" cy="12" r="6" fill="black"/></svg>
        </button>
        <button onclick="setSize(14)">
          <svg width="32" height="32"><circle cx="16" cy="16" r="14" fill="black"/></svg>
        </button>
      </div>
    </div>
  </div>
  <br />
  <div id="actionButtons">
    <button id="clear">🧽 Clear</button>
    <button id="snap">📤 Send</button>
  </div>

  <script>
   const colors = [
     '#FF6F00', // orange
     '#2D2A7B', // dark blue
     '#8E44AD', // purple
     '#00BFFF', // deep sky blue
     '#FFD700', // gold
     '#5D3FD3', // indigo
     '#FF69B4', // pink
     '#FF0000', // red
     '#008000', // green
     '#8B4513', // brown
     '#000000'  // black
   ];
    let brushColor = colors[0];
    let brushSize = 4;

    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snap');
    const clearBtn = document.getElementById('clear');
    const ctx = canvas.getContext('2d');

    const colorButtonsDiv = document.getElementById('colorButtons');
    colors.forEach(color => {
      const btn = document.createElement('button');
      btn.style.backgroundColor = color;
      if (color === brushColor) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        document.querySelectorAll('#colorButtons button').forEach(b => b.classList.remove('selected'));
        brushColor = color;
        ctx.strokeStyle = brushColor;
        btn.classList.add('selected');
      });
      colorButtonsDiv.appendChild(btn);
    });

    function setSize(size) {
      brushSize = size;
      ctx.lineWidth = brushSize;
      document.querySelectorAll('#sizeButtons button').forEach(b => b.classList.remove('selected'));
      const index = [2, 6, 14].indexOf(size);
      if (index !== -1) {
        document.querySelectorAll('#sizeButtons button')[index + 1].classList.add('selected');
      }
    }
    // Set default selected size button
    document.querySelectorAll('#sizeButtons button')[1].classList.add('selected');

    function fillCanvas() {
      ctx.fillStyle = brushColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Set canvas background to white
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = brushSize;
    ctx.strokeStyle = brushColor;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false;

    canvas.addEventListener('touchstart', (e) => {
      drawing = true;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const scaleX = canvas.width / canvas.clientWidth;
      const scaleY = canvas.height / canvas.clientHeight;
      ctx.strokeStyle = brushColor;
      ctx.beginPath();
      ctx.moveTo((touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY);
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!drawing) return;
      e.preventDefault(); // prevent scrolling
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const scaleX = canvas.width / canvas.clientWidth;
      const scaleY = canvas.height / canvas.clientHeight;
      ctx.lineTo((touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY);
      ctx.stroke();
    });

    canvas.addEventListener('touchend', () => {
      drawing = false;
    });

    canvas.addEventListener('mousedown', (e) => {
      drawing = true;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / canvas.clientWidth;
      const scaleY = canvas.height / canvas.clientHeight;
      ctx.strokeStyle = brushColor;
      ctx.beginPath();
      ctx.moveTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / canvas.clientWidth;
      const scaleY = canvas.height / canvas.clientHeight;
      ctx.lineTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
      ctx.stroke();
    });

    canvas.addEventListener('mouseup', () => {
      drawing = false;
    });
    canvas.addEventListener('mouseleave', () => {
      drawing = false;
    });

    const socket = new WebSocket("wss://td-tests-b8ab469bdcc6.herokuapp.com");

    socket.onopen = () => console.log('✅ WebSocket connected');
    socket.onerror = err => console.error('❌ WebSocket error:', err);

    snapBtn.addEventListener('click', () => {
      const imageData = new Image();
      imageData.src = document.getElementById('guideImage').src;
      imageData.onload = () => {
        ctx.drawImage(imageData, 0, 0, canvas.width, canvas.height);
        const outputData = canvas.toDataURL('image/png');
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(outputData);
          alert("📤 Drawing sent via WebSocket");
        } else {
          alert("❌ WebSocket not connected");
        }
      };
    });

    clearBtn.addEventListener('click', () => {
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    });
  </script>
</body>
</html>
