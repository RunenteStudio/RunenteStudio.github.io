<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shooter Control</title>
  <!-- Include glMatrix from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 0.5em;
    }
    .status, .quaternion, .player-slot {
      margin-bottom: 10px;
    }
    label {
      font-size: 16px;
      margin-right: 5px;
    }
    select {
      font-size: 16px;
      padding: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-right: 10px;
      margin-top: 10px;
    }
    #permissionButton {
      margin-bottom: 10px;
    }
    /* Style for the big action button */
    #actionButton {
      width: 100%;
      height: 100vw;
      padding: 20px;
      font-size: 24px;
      margin-top: 20px;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    #actionButton.pressed {
      filter: brightness(70%);
    }
    /* Style for the simulation mode button */
    #simulationButton {
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Control de shooter</h1>
  <div class="status">Status: <span id="connectionStatus">Disconnected</span></div>
  <div class="quaternion">Rotación: <span id="quaternionDisplay">[0.0000, 0.0000, 0.0000, 1.0000]</span></div>
  
  <!-- Player Slot Selection Dropdown -->
  <div class="player-slot">
    <label for="playerSlot">Jugador:</label>
    <select id="playerSlot">
      <option value="p1">Player 1</option>
      <option value="p2">Player 2</option>
      <option value="p3">Player 3</option>
      <option value="p4">Player 4</option>
      <option value="p5">Player 5</option>
      <option value="p6">Player 6</option>
      <option value="p7">Player 7</option>
      <option value="p8">Player 8</option>
    </select>
  </div>
  
  <!-- Button to disconnect the WebSocket connection -->
  <button id="disconnectButton">Disconnect</button>
  <!-- This button will only show if permission is needed -->
  <button id="permissionButton" style="display:none;">Enable Orientation</button>
  <!-- Big Action Button -->
  <button id="actionButton"></button>
  <!-- Simulation Mode Button -->
  <button id="simulationButton">Modo fantasma</button>

  <script>
    // Unique id generation using random characters (previous method, kept as reference):
    // const deviceId = Math.random().toString(36).substring(2, 7);
    // Now using a dropdown menu to select between 4 player slots (p1, p2, p3, p4).

    // WebSocket variables
    let ws;
    const wsUrl = "wss://td-tests-b8ab469bdcc6.herokuapp.com";
    let manualDisconnect = false;
    const connectionStatusElem = document.getElementById('connectionStatus');

    // Orientation data (from sensor)
    let orientationData = { alpha: 0, beta: 0, gamma: 0 };

    // Button pressed state (for the action button)
    let buttonPressed = false;

    // Simulation mode flag and timer id
    let simulationMode = false;
    let simulationTimeoutID = null;

    // Sensor update interval id and update rate (20 times per second)
    let sensorIntervalID = null;
    const updateInterval = 25; // milliseconds

    // Get player slot dropdown element
    const playerSlotSelect = document.getElementById('playerSlot');

    // Define color palette for player slots
    const playerColors = {
      'p1': '#FF4136', // Red
      'p2': '#2ECC40', // Green
      'p3': '#0074D9', // Blue
      'p4': '#FFDC00', // Yellow
      'p5': '#B10DC9', // Purple
      'p6': '#FF851B', // Orange
      'p7': '#00C4B4', // Teal
      'p8': '#FF69B4'  // Hot Pink
    };

    // Function to update the connection status display
    function updateStatus(status) {
      connectionStatusElem.textContent = status;
    }

    // Function to connect (or reconnect) the WebSocket
    function connectWebSocket() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("WebSocket connected");
        updateStatus("Connected");
      };

      ws.onclose = () => {
        console.log("WebSocket disconnected");
        updateStatus("Disconnected");
        if (!manualDisconnect) {
          updateStatus("Reconnecting...");
          setTimeout(connectWebSocket, 3000);
        }
      };

      ws.onerror = (error) => {
        console.error("WebSocket error:", error);
        ws.close();
      };

      ws.onmessage = (msg) => {
        console.log("Received message:", msg.data);
      };
    }

    // Start initial WebSocket connection
    connectWebSocket();

    // Disconnect button functionality
    document.getElementById('disconnectButton').addEventListener('click', () => {
      manualDisconnect = true;
      if (ws) {
        ws.close();
      }
      updateStatus("Disconnected");
    });

    // Device orientation permission handling (for iOS 13+)
    const permissionButton = document.getElementById('permissionButton');
    function enableOrientation() {
      DeviceOrientationEvent.requestPermission()
        .then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            permissionButton.style.display = 'none';
          } else {
            alert("Permission denied for device orientation.");
          }
        })
        .catch(console.error);
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && 
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      permissionButton.style.display = 'inline-block';
      permissionButton.addEventListener('click', enableOrientation);
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }

    // Handle device orientation event
    function handleOrientation(event) {
      orientationData.alpha = event.alpha || 0;
      orientationData.beta  = event.beta  || 0;
      orientationData.gamma = event.gamma || 0;
    }

    // Convert Euler angles to quaternion using glMatrix (expects degrees in X, Y, Z)
    function eulerToQuaternion(beta, gamma, alpha) {
      const q = quat.create();
      quat.fromEuler(q, beta, gamma, alpha);
      return q; // [x, y, z, w]
    }

    // Start sensor updates (sending sensor-based messages)
    function startSensorUpdates() {
      sensorIntervalID = setInterval(() => {
        const q = eulerToQuaternion(orientationData.beta, orientationData.gamma, orientationData.alpha);
        const qRounded = [
          Number(q[0].toFixed(3)),
          Number(q[1].toFixed(3)),
          Number(q[2].toFixed(3)),
          Number(q[3].toFixed(3))
        ];
        document.getElementById('quaternionDisplay').textContent = `[${qRounded.join(', ')}]`;

        // Use the currently selected player slot value (e.g. "p1", "p2", etc.)
        const currentId = playerSlotSelect.value;
        const message = JSON.stringify({
          id: currentId,
          quat: qRounded,
          pr: buttonPressed ? 1 : 0
        });

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(message);
        }
      }, updateInterval);
    }

    // Stop sensor updates
    function stopSensorUpdates() {
      if (sensorIntervalID !== null) {
        clearInterval(sensorIntervalID);
        sensorIntervalID = null;
      }
    }

    // Simulation loop: sends simulated events at random intervals (1 to 2 seconds)
    function startSimulationLoop() {
      function simulateEvent() {
        const randomBeta = Math.random() * 360 - 180;
        const randomGamma = Math.random() * 180 - 90;
        const randomAlpha = Math.random() * 360;
        const q = eulerToQuaternion(randomBeta, randomGamma, randomAlpha);
        const qRounded = [
          Number(q[0].toFixed(3)),
          Number(q[1].toFixed(3)),
          Number(q[2].toFixed(3)),
          Number(q[3].toFixed(3))
        ];
        const randomPressed = Math.random() < 0.1 ? 1 : 0;
        document.getElementById('quaternionDisplay').textContent = `[${qRounded.join(', ')}]`;

        // Use the currently selected player slot value
        const currentId = playerSlotSelect.value;
        const message = JSON.stringify({
          id: currentId,
          quat: qRounded,
          pr: randomPressed
        });

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(message);
        }
        // Schedule next simulated event between 1 and 2 seconds
        const delay = Math.random() * 10 + 20;
        simulationTimeoutID = setTimeout(simulateEvent, delay);
      }
      simulateEvent();
    }

    // Stop simulation loop
    function stopSimulationLoop() {
      if (simulationTimeoutID !== null) {
        clearTimeout(simulationTimeoutID);
        simulationTimeoutID = null;
      }
    }

    // Action Button event handling for both mouse and touch events
    const actionButton = document.getElementById('actionButton');
    function setButtonPressed(state) {
      buttonPressed = state;
      if (state) {
        actionButton.classList.add('pressed');
      } else {
        actionButton.classList.remove('pressed');
      }
    }
    actionButton.addEventListener('mousedown', () => setButtonPressed(true));
    actionButton.addEventListener('mouseup', () => setButtonPressed(false));
    actionButton.addEventListener('mouseleave', () => setButtonPressed(false));
    actionButton.addEventListener('touchstart', (e) => {
      e.preventDefault();
      setButtonPressed(true);
    });
    actionButton.addEventListener('touchend', () => setButtonPressed(false));
    actionButton.addEventListener('touchcancel', () => setButtonPressed(false));

    // Simulation Mode Button: toggles simulation mode
    const simulationButton = document.getElementById('simulationButton');
    simulationButton.addEventListener('click', () => {
      simulationMode = !simulationMode;
      if (simulationMode) {
        stopSensorUpdates();
        startSimulationLoop();
        simulationButton.textContent = "Stop Simulation";
      } else {
        stopSimulationLoop();
        startSensorUpdates();
        simulationButton.textContent = "Start Simulation";
      }
    });

    // Function to update button color based on player slot
    function updateButtonColor() {
      const selectedSlot = playerSlotSelect.value;
      actionButton.style.backgroundColor = playerColors[selectedSlot];
    }

    // Add event listener for player slot changes
    playerSlotSelect.addEventListener('change', updateButtonColor);

    // Set initial button color
    updateButtonColor();

    // Start sensor updates by default.
    startSensorUpdates();
  </script>
</body>
</html>
